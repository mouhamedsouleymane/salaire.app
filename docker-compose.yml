services:
    db:
        image: mysql:8.0
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: salaire
            MYSQL_USER: salaire_user
            MYSQL_PASSWORD: salaire_pass
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"

    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        environment:
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: salaire
            DB_USERNAME: salaire_user
            DB_PASSWORD: salaire_pass
            APP_KEY: base64:J8xinPvIlWZrcfIvvx+hHNMhBrhtIgVjI4pamzV53xU=
            APP_ENV: local
            APP_DEBUG: true
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        restart: always
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

volumes:
    db_data:
